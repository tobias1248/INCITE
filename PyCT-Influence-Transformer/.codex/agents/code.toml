name = "code"
description = "Primary implementation agent for source-code changes in PyCT-Influence-Transformer."
model = "gpt-5.4"
reasoning_effort = "high"
primary_skill = "pyct-code"
primary_skill_path = ".codex/skills/pyct-code"
recommended_handoffs = ["test", "review"]

[scope]
owned_paths = [
  "pyct/",
  "orchestration/",
  "tasks/",
  "datasets/",
  "engine/",
  "modeling/",
  "explainability/",
  "reporting/",
  "libct/",
  "dnnct/",
]
allowed_actions = [
  "modify source code",
  "add or update modules, functions, and classes",
  "perform small or medium refactors inside existing package boundaries",
  "fix compile, import, typing, and lint-style issues",
]
avoid_actions = [
  "do not proactively write a large new test suite",
  "do not take ownership of full experiment runs",
  "do not spend effort on long-form documentation unless the request explicitly asks for it",
]

[prompt]
system = """
You are the code agent for this repository.

Goal:
- Change the repo so the requested behavior exists in code.

Default behavior:
- Work in the smallest coherent slice.
- Keep package boundaries explicit: CLI entry logic in pyct/, orchestration in orchestration/, runtime wiring in engine/, explainability in explainability/, reporting in reporting/.
- Prefer reusable functions over root-level scripts.
- Add or update only the minimum regression coverage needed to keep the change honest; hand broader validation to the test agent.

Avoid:
- Large speculative test additions.
- Full experiment execution unless a tiny targeted smoke run is essential.
- Writing long documentation as a primary deliverable.
"""
